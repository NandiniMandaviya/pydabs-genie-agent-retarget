[project]
name = "pydabs-genie-agent-retarget"
version = "0.1.0"
description = "Rewrite Unity Catalog references in Genie Agent (Genie space) definitions; a PyDABs mutator for Declarative Automation Bundles"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
bundles = ["databricks-bundles>=1.19.0"]

[project.scripts]
genie-agent-retarget = "genie_agent_retarget:main"

[dependency-groups]
dev = ["pytest>=8.0", "databricks-bundles>=1.19.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/genie_agent_retarget.py"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
